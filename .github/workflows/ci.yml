name: Test pnbp

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pnbp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[legacy-markdown]" pytest ruff

      - name: Compile Python sources
        run: python -W error -m compileall -q src apps/web tests scripts

      - name: Check release-blocking lint rules
        run: python -m ruff check --select E9,F63,F7,F82,W605 src apps/web tests scripts

      - name: Run tests
        run: python -m pytest

      - name: Check bounded Markdown workloads
        if: matrix.python-version == '3.14'
        run: python scripts/check_markdown.py --legacy

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: |
          python -m build --outdir dist/pretty-notebook
          python -m build packages/pnbp-transition --outdir dist/pnbp
          python scripts/check_release_distributions.py

      - name: Check distribution metadata
        run: python -m twine check --strict dist/pretty-notebook/* dist/pnbp/*

      - name: Test the installed wheel
        shell: bash
        run: |
          test_venv="${RUNNER_TEMP}/pnbp-wheel-test"
          note_path="${RUNNER_TEMP}/pnbp-smoke-notes"

          python -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install --upgrade pip
          "$test_venv/bin/python" -m pip install dist/pretty-notebook/*.whl
          "$test_venv/bin/python" -m pip install --no-deps dist/pnbp/*.whl
          "$test_venv/bin/python" -m pip check
          "$test_venv/bin/python" -c "import importlib.util; assert importlib.util.find_spec('markdown') is None"
          "$test_venv/bin/python" -c "import pretty_notebook, pnbp; assert pretty_notebook.Notebook is pnbp.Notebook"
          "$test_venv/bin/pnbp" --help
          "$test_venv/bin/pnbp" deploy plan --domain notes.example.com \
            --revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > "${RUNNER_TEMP}/deployment-plan.json"

          "$test_venv/bin/python" scripts/exercise_release.py "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"

          mkdir -p "$note_path"
          printf '#public\nHello.\n' > "$note_path/example.md"

          NOTE_PATH="$note_path" PNBP_SETTINGS=off \
            "$test_venv/bin/python" -c \
            'from pretty_notebook import Notebook; nb = Notebook(); assert "example" in nb.notes'

  web-test:
    name: Web API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install web app and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --editable ../.. --no-deps
          python -m pip install --requirement requirements-test.txt ruff
          python -m pip check

      - name: Compile web sources
        run: python -W error -m compileall -q api views main.py web_config.py assets.py install_assets.py tests

      - name: Check release-blocking lint rules
        run: python -m ruff check --select E9,F63,F7,F82,W605 api views main.py web_config.py assets.py install_assets.py tests

      - name: Verify reviewed local browser assets
        run: python install_assets.py --check

      - name: Run web integration tests
        run: |
          python -m coverage run --branch --source=api,views,main,assets,install_assets,web_config -m pytest tests
          python -m coverage report --show-missing --fail-under=95

      - name: Set up JavaScript test runtime
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check local browser interactions
        run: node --test tests/*.test.cjs

      - name: Exercise supported deployment command
        env:
          JWT_ALGO: HS256
          JWT_SECRET: ci-deployment-smoke-jwt-secret-32-bytes
          PNBP_ALLOWED_HOSTS: 127.0.0.1
          PNBP_BOOTSTRAP_TOKEN: ci-deployment-smoke-bootstrap-token-32-bytes
          PNBP_DATA_DIR: ${{ runner.temp }}/pnbp-web-state
          PNBP_ASSET_MODE: local
        run: |
          gunicorn main:api --no-control-socket \
            --workers 4 \
            --worker-class uvicorn_worker.UvicornWorker \
            --bind 127.0.0.1:8765 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          healthy=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              --header 'Host: 127.0.0.1' \
              http://127.0.0.1:8765/healthz; then
              healthy=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          test "$healthy" = true
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: untrusted.example' \
            http://127.0.0.1:8765/healthz)" = 400

  deployment-config:
    name: Linux deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install platform validators and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
          python -m pip install --editable . pytest
      - name: Verify generated Linux deployment files
        run: python -m pytest tests/test_deploy.py -q
