[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pretty-notebook"
version = "0.10.0"
description = "Python tools for parsing and querying wiki-linked, tagged Markdown notebooks."
readme = "docs/pnbp.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "prettynb" },
]
maintainers = [
    { name = "Outside Labs" },
]

keywords = [
    "markdown",
    "notes",
    "wikilinks",
    "knowledge-management",
]

dependencies = [
    "click>=8.0",
    "requests>=2.26",
    "rich>=10.6",
]

[project.optional-dependencies]
legacy-markdown = ["markdown>=3.3.4"]

[project.urls]
Homepage = "https://outside-labs.com"
Repository = "https://github.com/outside-labs/pretty-notebook"
Documentation = "https://github.com/outside-labs/pretty-notebook/tree/v0.10.0/docs"
Issues = "https://github.com/outside-labs/pretty-notebook/issues"

[project.scripts]
pnbp = "pretty_notebook.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pretty_notebook*", "pnbp*"]
namespaces = false

[tool.setuptools.package-data]
pretty_notebook = ["resources/deploy/*.tmpl"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib\\.utils",
]
