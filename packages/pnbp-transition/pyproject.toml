[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pnbp"
version = "0.11.0"
description = "Compatibility distribution that installs Pretty Notebook."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "prettynb" }]
maintainers = [{ name = "Outside Labs" }]
dependencies = ["pretty-notebook==0.11.0"]

[project.urls]
Repository = "https://github.com/wispsy/pretty-notebook"
Documentation = "https://github.com/wispsy/pretty-notebook/tree/v0.11.0/docs"
Issues = "https://github.com/wispsy/pretty-notebook/issues"

[tool.setuptools]
packages = []
